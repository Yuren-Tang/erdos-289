name: Manuscript

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build and finite certificate
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Install TeX and PDF tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            biber \
            latexmk \
            poppler-utils \
            texlive-bibtex-extra \
            texlive-fonts-extra \
            texlive-latex-extra \
            texlive-pictures \
            texlive-plain-generic \
            texlive-xetex

      - name: Verify finite certificate
        run: python3 verification/check_finite_certificate.py

      - name: Build manuscript
        run: sh build.sh

      - name: Verify publication artifact
        shell: bash
        run: |
          set -euo pipefail
          pdf='Reciprocal Sums over Separated Integer Intervals.pdf'
          test -s "$pdf"
          pages="$(pdfinfo "$pdf" | awk '/^Pages:/ {print $2}')"
          test "$pages" = 40
          echo "Verified $pdf ($pages pages)."
