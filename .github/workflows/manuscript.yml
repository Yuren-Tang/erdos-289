name: Manuscript

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Install TeX and PDF tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            biber \
            latexmk \
            poppler-utils \
            texlive-bibtex-extra \
            texlive-fonts-extra \
            texlive-fonts-recommended \
            texlive-latex-extra \
            texlive-pictures \
            texlive-plain-generic \
            texlive-xetex

      - name: Build manuscript
        run: sh build.sh

      - name: Check manuscript output
        shell: bash
        run: |
          set -euo pipefail
          pdf='Reciprocal Sums over Separated Integer Intervals.pdf'
          test -s "$pdf"
          title="$(pdfinfo "$pdf" | sed -n 's/^Title:[[:space:]]*//p')"
          author="$(pdfinfo "$pdf" | sed -n 's/^Author:[[:space:]]*//p')"
          pages="$(pdfinfo "$pdf" | awk '/^Pages:/ {print $2}')"
          test "$title" = 'Reciprocal Sums over Separated Integer Intervals'
          test "$author" = 'Yuren Tang'
          test "$pages" = 40
          echo "Checked $pdf: $title — $author ($pages pages)."
