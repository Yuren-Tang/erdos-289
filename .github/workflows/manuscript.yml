name: manuscript

on:
  push:
    branches:
      - paper/publication-rewrite
  workflow_dispatch:

env:
  ARXIV_TEX_IMAGE: registry.gitlab.com/islandoftex/images/texlive:TL2025-2025-08-03-full

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Guard active manuscript source
        working-directory: paper
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path

          root = Path("manuscript.tex")
          root_text = root.read_text(encoding="utf-8")
          active_section_paths = [
              Path(name + ".tex")
              for name in re.findall(r"\\input\{(sections/[^}]+)\}", root_text)
          ]
          files = [root, *active_section_paths]
          corpus = "\n".join(p.read_text(encoding="utf-8") for p in files)

          numeric_tags = re.findall(r"\\tag\{\d+\.\d+\}", corpus)
          if numeric_tags:
              raise SystemExit("Manual numeric equation tags are forbidden in the active main text: " + repr(numeric_tags))

          labels = re.findall(r"\\label\{([^}]+)\}", corpus)
          duplicates = sorted({x for x in labels if labels.count(x) > 1})
          if duplicates:
              raise SystemExit("Duplicate active-source LaTeX labels: " + repr(duplicates))

          refs = re.findall(r"\\(?:eqref|ref)\{([^}]+)\}", corpus)
          missing = sorted(set(refs) - set(labels))
          # These targets live in the three active appendices, which are checked
          # by the full XeLaTeX/Biber build below.
          appendix_targets = {
              "app:prime-supply",
              "app:restricted-fold",
              "app:prefix-seed",
              "thm:restricted-fold",
              "lem:finite-prefix-initialization",
              "eq:finite-seed-bound",
              "eq:future-bridge-total",
          }
          missing = [x for x in missing if x not in appendix_targets]
          if missing:
              raise SystemExit("References without active-source targets: " + repr(missing))

          print(
              f"Active-source guard PASS: {len(active_section_paths)} sections, "
              f"{len(labels)} unique labels, no manual numeric tags."
          )
          PY

      - name: Replay finite initialization
        working-directory: paper
        run: python3 tools/verify_prefix_seed.py

      - name: Pull TeX Live 2025-08-03 full snapshot
        run: docker pull "$ARXIV_TEX_IMAGE"

      - name: Verify TeX identity and arXiv-visible typography dependencies
        run: |
          docker run --rm "$ARXIV_TEX_IMAGE" bash -lc '
            set -euo pipefail
            xelatex --version | head -n 2
            biber --version | head -n 1
            latexmk -v | head -n 2
            kpsewhich ETbb-Regular.otf
            kpsewhich ETbb-Bold.otf
            kpsewhich ETbb-Italic.otf
            kpsewhich ETbb-BoldItalic.otf
            kpsewhich EBGaramond-Medium.otf
            kpsewhich newtxmath.sty
            kpsewhich microtype.sty
            kpsewhich fontspec.sty
            kpsewhich trajan.sty
            kpsewhich soul.sty
            kpsewhich binhex.tex
          '

      - name: Build manuscript in TeX Live 2025-08-03 full snapshot
        run: |
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            -e HOME=/tmp \
            -v "$PWD:/workspace" \
            -w /workspace/paper \
            "$ARXIV_TEX_IMAGE" \
            bash -lc 'latexmk -xelatex -interaction=nonstopmode -halt-on-error manuscript.tex'

      - name: Install PDF diagnostics only
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends poppler-utils

      - name: Extract PDF diagnostics
        working-directory: paper
        run: |
          pdftotext -enc UTF-8 manuscript.pdf manuscript.txt
          pdffonts manuscript.pdf > manuscript-fonts.txt

      - name: Seal references, glyphs, fonts, and layout
        working-directory: paper
        run: |
          test -s manuscript.pdf
          test -s manuscript.bbl
          if grep -E "LaTeX Warning: (There were undefined references|Reference .* undefined|Citation .* undefined|Label .* multiply defined)" manuscript.log; then
            echo "Unresolved or duplicate manuscript references remain."
            exit 1
          fi
          if grep -q "Missing character:" manuscript.log; then
            grep "Missing character:" manuscript.log
            exit 1
          fi
          if grep -Fq 'Overfull \\hbox' manuscript.log; then
            grep -F 'Overfull \\hbox' manuscript.log
            exit 1
          fi
          if grep -E "(^|[[:space:]])(WARN|ERROR) -" manuscript.blg; then
            echo "Biber reported a warning or error."
            exit 1
          fi
          if grep -q "Type 3" manuscript-fonts.txt; then
            echo "Type 3 fonts are not permitted."
            exit 1
          fi
          grep -q "0009-0006-0847-3330" manuscript.txt
          python3 - <<'PY'
          import re
          from pathlib import Path
          text = Path("manuscript.txt").read_text(encoding="utf-8")
          leaked = sorted(set(re.findall(r"\b(?:eq|thm|sec|lem|prop|app):[A-Za-z0-9_.:-]+", text)))
          if leaked:
              raise SystemExit("Internal LaTeX labels leaked into PDF text: " + repr(leaked))
          PY

      - name: Upload manuscript PDF
        uses: actions/upload-artifact@v4
        with:
          name: e289-publication-manuscript
          path: paper/manuscript.pdf
