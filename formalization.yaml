# Metadata for the statement this repository formalizes.
# The fields are informal project metadata, not a published schema.

problem:
  collection: erdosproblems.com
  id: 289
  url: https://www.erdosproblems.com/289
  status_upstream: open
  statement: >-
    Is it true that, for all sufficiently large k, there exist finite intervals
    I_1, ..., I_k in the natural numbers, distinct, not overlapping or adjacent,
    with |I_i| >= 2 for 1 <= i <= k, such that 1 = sum_i sum_{n in I_i} 1/n?

formalization:
  toolchain: leanprover/lean4:v4.33.0
  mathlib: v4.33.0
  source_statement:
    name: Erdos289.ErdosProblem289
    file: Erdos289/Literal.lean
    matches: the sentence displayed on erdosproblems.com/289
    checked_by: >-
      Erdos289Test/Smoke.lean, by `Iff.rfl` against the sentence written out
      independently
  intrinsic_statement:
    name: Erdos289.IntervalSaturation
    file: Erdos289/Statement.lean
    description: >-
      The same problem stated without interval coordinates: the exact
      reciprocal grade spectrum at 1 is cofinite, over the problem's own class
      of block sizes, every block of length at least two.
    implies_source_statement: Erdos289.erdosProblem289_of_intervalSaturation
  strengthening:
    name: Erdos289.SmallBlockSaturation
    file: Erdos289/Statement.lean
    description: >-
      The statement this development actually proves conditionally: the same,
      with every block of length exactly two or three.
    implies_intrinsic_statement: Erdos289.intervalSaturation_of_smallBlock
  weaker_variants:
    - matches: >-
        the right-hand side of `erdos_289` in
        google-deepmind/formal-conjectures, FormalConjectures/ErdosProblems/289.lean
      note: >-
        Omits the non-adjacency requirement, so it is implied by
        Erdos289.ErdosProblem289; derived in Erdos289Test/Smoke.lean.
  proved: false
  reduced_to: Erdos289.smallBlockSaturation_of_tailInterface
  open_obligation: >-
    The cofinal tail interface: beyond any finite footprint, states of every
    sufficiently large grade whose residues cover the ambient group modulo the
    core's cyclic subgroup, with total load below the core's barrier slack.
  remaining_work: ROADMAP.md

conventions:
  numerical_constants: >-
    A numerical constant occurs in a public statement only when it belongs to
    the source problem, to an exact identity, to a sharp or uniform structural
    theorem, or to a canonical extremum.  Constants obtained by specializing a
    parametric theorem are witnesses and stay inside proofs or labelled
    corollaries.
  asymptotics: >-
    An asymptotic statement is formalized with Asymptotics/Filter.atTop, never
    as an inequality beyond a hand-picked threshold.

trust:
  source_scan: scripts/source_scan.py
  axiom_audit: Audit.lean
  external_kernel_checks:
    - leanchecker
    - nanoda
  accepted_axioms:
    - propext
    - Classical.choice
    - Quot.sound
